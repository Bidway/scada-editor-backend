spring:
  application:
    name: runtime

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8085

runtime:
  # Разовое (не горячий путь) обращение к editor — только при старте сессии мониторинга.
  # Дерево проекта приходит уже со связями (ComponentProperty.tagId = путь узла = Kafka-key),
  # поэтому обращений к channel нет вообще.
  editor-base-url: http://${EDITOR_HOST:localhost}:${EDITOR_PORT:8083}
  # Окно батчинга исходящих WS-сообщений с тегами/свойствами (см. OutboundFlusher).
  flush-interval-ms: 40
  # Потоки отправки WS-кадров. Отправка блокирующая и упирается в сеть клиента,
  # поэтому потоков нужно больше, чем ядер: медленный клиент занимает поток, но не
  # должен задерживать остальные сессии. По умолчанию — число ядер (минимум 4).
  # flush-threads: 16
  script:
    # Пул Graal-контекстов. Фактический размер поднимается до on-change-threads:
    # контекстов должно хватать на всех одновременных вызывающих, иначе поток ждёт
    # весь execution-timeout и затем создаёт временный контекст с полным прогревом.
    context-pool-size: ${RUNTIME_SCRIPT_CONTEXT_POOL:4}
    execution-timeout-ms: ${RUNTIME_SCRIPT_TIMEOUT_MS:200}
    # Полосы исполнения onChange вне треда Kafka-consumer'а. Сессия закреплена за
    # полосой, поэтому её скрипты идут последовательно, а разные сессии — параллельно.
    # По умолчанию — число ядер (минимум 2); раскомментировать, чтобы задать явно.
    # on-change-threads: 8
    # Глубина очереди полосы. При переполнении задача отбрасывается со сводным warn:
    # приём телеметрии важнее, чем гарантия исполнения каждого onChange.
    on-change-queue-capacity: ${RUNTIME_SCRIPT_ONCHANGE_QUEUE:1000}
  ws:
    # Требовать на WS-handshake личность, проверенную gateway (заголовок X-Username).
    # Подпись токена снимает gateway — он единственный вход в контур. Для локального
    # прогона runtime без gateway: RUNTIME_WS_REQUIRE_AUTH=false.
    require-auth: ${RUNTIME_WS_REQUIRE_AUTH:true}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer-group-id: runtime-service
  # Потоков на чтение топика тегов. Порядок по каждому тегу сохраняется при любом
  # значении: key = tagId, поэтому один тег всегда в одной партиции, а партиция
  # принадлежит одному потоку. Выигрыш ограничен числом партиций топика — потоки
  # сверх него простаивают. По умолчанию — половина ядер (минимум 2).
  # concurrency: 4
  # Батч на один poll: разбор тела теперь идёт только для подписанных тегов,
  # поэтому крупный батч окупается меньшим числом round-trip'ов до брокера.
  max-poll-records: ${KAFKA_MAX_POLL_RECORDS:2000}
  # Копим ответ брокера до этого объёма или до fetch-max-wait-ms — что раньше.
  # Под нагрузкой объём набирается мгновенно и батчинг работает; на простаивающей
  # установке ждать пришлось бы весь таймаут, поэтому порог умеренный.
  fetch-min-bytes: ${KAFKA_FETCH_MIN_BYTES:16384}
  # Потолок задержки, вносимой fetch-min-bytes. Держим ниже flush-interval-ms (40 мс):
  # всё, что уложилось в окно флаша, попадает в тот же кадр и оператору не видно.
  fetch-max-wait-ms: ${KAFKA_FETCH_MAX_WAIT_MS:20}
  # Единый топик проекта: все контроллеры/драйверы пишут значения тегов сюда,
  # различаются по key сообщения (= Node.idNode).
  tags-topic: ${KAFKA_TAGS_TOPIC:scada.tags}
  # Обратное направление: запись тега в ПЛК. Имя топика задано шлюзом
  # (kafka.topics.commands в его конфиге), результат он кладёт в scada-command-results.
  commands-topic: ${KAFKA_COMMANDS_TOPIC:scada-commands}
