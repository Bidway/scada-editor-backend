# HTTPS обязателен: фронт в production ставит cookie входа с флагом Secure, и по голому
# http:// (кроме localhost) браузер её не сохраняет — вход молча не срабатывает.
# Сертификат самоподписанный, выпускается командой из README (шаг 6).

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;

    ssl_certificate     /etc/ssl/scada-demo/cert.pem;
    ssl_certificate_key /etc/ssl/scada-demo/key.pem;

    # Импорт схемы из файла и картинки в компонентах.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
