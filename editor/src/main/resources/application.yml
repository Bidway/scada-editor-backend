spring:
  application:
    name: editor

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:savushkin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: editor
        hbm2ddl.create_namespaces: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8083

editor:
  versions:
    # Автосохранения старше этого срока прореживаются до одного в сутки. Ручные сохранения
    # и восстановления не трогаются. Число подобрано без замера — поправить после первого
    # месяца работы, посмотрев фактический размер editor.document_version.
    autosave-retention-days: 30
    retention-cron: "0 30 3 * * *"
  # Автопривязка читает базу каналов прямо из channel, минуя gateway.
  channel-base-url: http://${CHANNEL_HOST:localhost}:${CHANNEL_PORT:8082}
  recipes:
    # Один файл на рецепт, имя — <component_id>-<slug>.json. Переопределяется переменной
    # окружения, как остальной конфиг сервиса.
    storage-path: ${RECIPES_DIR:./data/recipes}
  automation:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      definitions-topic: ${AUTOMATION_DEFINITIONS_TOPIC:automation.definitions}
      # Фиксируется навсегда: смена числа партиций разнесёт версии одного проекта по разным
      # партициям. 12 делится на 1, 2, 3, 4, 6, 12 — ровное распределение экземпляров automation.
      partitions: 12
      # На объекте — 3 (и min.insync.replicas=2 на топике), на стенде один брокер.
      replication-factor: ${AUTOMATION_TOPIC_REPLICATION:1}
    outbox:
      # Досылка после сбоя публикации. Пока сбоев нет, база не опрашивается: публикация идёт
      # сразу после коммита сохранения.
      retry-interval-ms: 30000
  runtime-projects:
    # Флаги «проект в эксплуатации»: bootstrap-servers общий с editor.automation.kafka —
    # один Kafka-кластер на сервис, топик отдельный, компактный.
    topic: ${RUNTIME_PROJECTS_TOPIC:runtime.projects}
    resync-interval-ms: 60000
    # false — флаг хранится, но в топик не публикуется (тестовый профиль).
    publish-enabled: true
