# Redis лежит на classpath (spring-boot-starter-data-redis), но в editor не используется:
# ни @EnableCaching, ни @Cacheable в коде нет. Автоконфигурацию выключаем, чтобы тестовый
# контекст не пытался найти живой сервер.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

editor:
  versions:
    autosave-retention-days: 30
    # 29 февраля — задача не должна срабатывать сама посреди прогона, в тесте её зовут руками.
    retention-cron: "0 0 0 29 2 ?"
