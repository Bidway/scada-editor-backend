# ============================================================================
# Продюсер-сторона (симулятор ПЛК + шлюз + его БД) для стенда, где наш backend
# и Kafka запущены НА ХОСТЕ нативно (start-all.ps1), а не в docker-compose.
#
# Чем отличается от docker-compose.producer.yml и почему нужен отдельный файл:
#   • тот — оверлей к docker-compose.yml и ждёт брокер ВНУТРИ сети (kafka:19092);
#     здесь брокер снаружи, поэтому адрес host.docker.internal:19092 и файл
#     самодостаточный (никаких -f docker-compose.yml).
#   • симулятору подменяется config/replay_config.yaml: в поставке ВСЕ 2471 тегов
#     объявлены access: RO, из-за чего OPC UA-узлы создаются недоступными для записи
#     (plc.py:180) и команда на клапан получала бы BadNotWritable. В нашей копии
#     тегам 385 и 389 (клапаны сцены BN1_MCA1) выставлен RW — только им.
#     Образ при этом НЕ пересобирается.
#
# Требуется (см. docs/SCRIPTS_PLAN.md, шаг 2.1): у нативной Kafka должен быть
# слушатель DOCKER на :19092 с advertised host.docker.internal, иначе контейнер
# получит метаданные с localhost и не подключится.
#
# Запуск:   docker compose -f docker-compose.producer.host.yml up -d
# Логи:     docker compose -f docker-compose.producer.host.yml logs -f scada-gateway
# Остановка: docker compose -f docker-compose.producer.host.yml down
# ============================================================================
services:

  scada-postgres:
    image: postgres:16
    pull_policy: never
    container_name: scada-postgres
    environment:
      POSTGRES_DB: scada_db
      POSTGRES_USER: scada_user
      POSTGRES_PASSWORD: scada_password
    # Порт наружу не публикуется — иначе конфликт с нативным PostgreSQL на 5432.
    volumes:
      - scada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada_user -d scada_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [scada]

  scada-simulator:
    image: scada-simulator:1.0
    pull_policy: never
    container_name: scada-simulator
    environment:
      # Сервер анонсирует этот адрес клиентам — имя должно резолвиться внутри сети.
      OPCUA_ENDPOINT: "opc.tcp://scada-simulator:4840"
      MODBUS_PORT: "5020"
    volumes:
      # Единственное отличие от поставки: RW у тегов 385/389 (см. шапку).
      - ./docker/sim/replay_config.yaml:/app/config/replay_config.yaml:ro
    ports:
      - "4840:4840"          # опционально: OPC UA с хоста (отладка uaread/uawrite)
      - "5020:5020"          # опционально: Modbus с хоста
    restart: unless-stopped
    networks: [scada]

  scada-gateway:
    image: scada-gateway:1.0
    pull_policy: never
    container_name: scada-gateway
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://scada-postgres:5432/scada_db"
      SPRING_DATASOURCE_USERNAME: "scada_user"
      SPRING_DATASOURCE_PASSWORD: "scada_password"
      # Брокер на хосте: слушатель DOCKER, advertised как host.docker.internal:19092.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:19092"
      # Топики: телеметрия — наша (её слушает runtime), команды — штатные для шлюза.
      KAFKA_TOPICS_TELEMETRY: "scada.tags"
      KAFKA_TOPICS_COMMANDS: "scada-commands"
      KAFKA_TOPICS_COMMAND_RESULTS: "scada-command-results"
      SIM_HOST: "scada-simulator"
    ports:
      - "8888:8888"          # actuator/http шлюза
    extra_hosts:
      # Docker Desktop добавляет запись сам, но на Linux-движке её нет — фиксируем явно.
      - "host.docker.internal:host-gateway"
    depends_on:
      scada-postgres:
        condition: service_healthy
      scada-simulator:
        condition: service_started
    restart: unless-stopped
    networks: [scada]

networks:
  scada:
    driver: bridge

volumes:
  scada_pgdata:
