server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: channel-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/channel/**

        - id: editor-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/editor/**

jwt:
  secret: f8d7e2c6a1b3f9e5d8c4a7b2e1f3c5d6a8b4e7f2c9d1a3b5e6f8c2d4e7f9a0b1