server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      httpclient:
        websocket:
          # Кадр телеметрии — это батч обновлений за окно флаша (40 мс) по всем тегам,
          # открытым на экране оператора. На плотной мнемосхеме батч легко перевалит
          # за дефолтные 64 КБ Reactor Netty, а это не усечение, а закрытие соединения
          # с кодом 1009. Одно значение задаёт лимит и для приёма кадров от runtime,
          # и для приёма от браузера (см. GatewayAutoConfiguration).
          max-frame-payload-length: ${WS_MAX_FRAME_BYTES:4194304}
      routes:
        - id: auth-service
          uri: http://${AUTH_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**

        - id: channel-service
          uri: http://${CHANNEL_HOST:localhost}:8082
          predicates:
            - Path=/api/channel/**

        - id: editor-service
          uri: http://${EDITOR_HOST:localhost}:8083
          predicates:
            - Path=/api/editor/**

        - id: runtime-service
          uri: http://${RUNTIME_HOST:localhost}:8085
          predicates:
            - Path=/api/runtime/**

        # Фоновые задачи исполняет runtime (этап 2А, 17.09.2026); путь /api/automation/** сохранён ради фронта.
        - id: automation-service
          uri: http://${RUNTIME_HOST:localhost}:8085
          predicates:
            - Path=/api/automation/**

        # WebSocket мониторинга маршрутизирует RuntimeInstanceRoutes по имени экземпляра в пути
        # (/ws/runtime/<instanceId>/…, этап 2Б). Порядок важен: /ws/** разбирается последним.
        # STOMP/SockJS редактора: уведомления SCENE_CHANGED (scada-fqr). Раньше /ws/** — тот
        # перехватил бы путь и увёл в channel.
        - id: editor-ws
          uri: http://${EDITOR_HOST:localhost}:8083
          order: 0
          predicates:
            - Path=/ws/editor/**

        # STOMP/SockJS канала.
        - id: channel-ws
          uri: http://${CHANNEL_HOST:localhost}:8082
          order: 1
          predicates:
            - Path=/ws/**

jwt:
  secret: ${JWT_SECRET:f8d7e2c6a1b3f9e5d8c4a7b2e1f3c5d6a8b4e7f2c9d1a3b5e6f8c2d4e7f9a0b1}
